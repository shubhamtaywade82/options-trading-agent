name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feat/**"
      - "feature/**"
      - "ccr-**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (application and tests)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

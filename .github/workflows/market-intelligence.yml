name: Market Intelligence CI

on:
  push:
    branches:
      - "feat/*"
  pull_request:
    paths:
      - "src/market/**"
      - "src/binance/indicators.ts"
      - "src/config.ts"
      - "src/agents/BaseAgent.ts"
      - "src/binance/client.ts"
      - "src/runtime/Orchestrator.ts"
      - "src/decision/SetupEngine.ts"
      - "src/ops/setupCards.ts"
      - "src/ops/setupNotice.ts"
      - "src/ops/hooks.ts"
      - "src/ops/telegram.ts"
      - "src/llm/**"
      - "src/learning/**"
      - "tests/market*.test.ts"
      - "tests/setup*.test.ts"
      - "tests/telegram.test.ts"
      - "tests/selfLearning.test.ts"
      - "tests/tradingCouncil.test.ts"
      - "tests/decisionEngine.test.ts"
      - "tests/structureLiquidityStrategy.test.ts"
      - ".github/workflows/market-intelligence.yml"

jobs:
  market-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # The repository currently contains a machine-local CoinDCX file dependency.
      # Install only the public packages required by the market-intelligence test slice.
      - name: Install market-test dependencies
        run: npm install --no-save --ignore-scripts tsx@4.19.0 zod@3.23.0 binance@2.15.22

      - name: Typecheck market-intelligence slice
        run: >
          npx tsc --noEmit
          --target ESNext
          --module NodeNext
          --moduleResolution NodeNext
          --strict
          --skipLibCheck
          src/types.ts
          src/config.ts
          src/binance/indicators.ts
          src/market/MarketDataTypes.ts
          src/market/MarketDataService.ts
          src/market/types.ts
          src/market/TimeframeEngine.ts
          src/market/RegimeEngine.ts
          src/market/StructureEngine.ts
          src/market/LiquidityEngine.ts
          src/market/ZoneEngine.ts
          src/market/MarketStateBuilder.ts

      - name: Typecheck agentic learning slice
        run: >
          npx tsc --noEmit
          --target ESNext
          --module NodeNext
          --moduleResolution NodeNext
          --strict
          --skipLibCheck
          src/types.ts
          src/config.ts
          src/market/MarketDataTypes.ts
          src/market/types.ts
          src/decision/SetupTypes.ts
          src/decision/SetupTiming.ts
          src/decision/SetupEngine.ts
          src/learning/AgentLedger.ts
          src/learning/ConfidenceAdjuster.ts
          src/learning/TradeOutcomeRecorder.ts
          src/learning/TradeGrader.ts
          src/llm/types.ts
          src/llm/personas.ts
          src/llm/TradingCouncil.ts

      - name: Run market-intelligence tests
        run: >
          npx tsx --test
          tests/marketIndicators.test.ts
          tests/marketState.test.ts
          tests/marketStateNativeData.test.ts
          tests/marketDataService.test.ts
          tests/marketConfig.test.ts
          tests/decisionEngine.test.ts
          tests/structureLiquidityStrategy.test.ts
          tests/setupEngine.test.ts
          tests/setupCards.test.ts
          tests/setupOps.test.ts
          tests/telegram.test.ts
          tests/selfLearning.test.ts
          tests/tradingCouncil.test.ts

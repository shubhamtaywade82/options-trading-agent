# Local stores for development and for running the integration suite.
#   POSTGRES_PASSWORD=<a password you choose> docker compose up -d   (or set it in .env)
#   TEST_DATABASE_URL=postgres://agent:<the same password>@127.0.0.1:5432/trading TEST_REDIS_URL=redis://127.0.0.1:6379/0 npm run test:integration
# The password is read from the environment and is never written in this file. Production uses its own secret store.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the environment or in .env}
      POSTGRES_DB: trading
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ledger-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d trading"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    # noeviction: a full Redis refuses writes instead of silently dropping a rate-gate slot or a cache entry.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ledger-data:
  redis-data:
